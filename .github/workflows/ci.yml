name: VecturAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Preprocessor Tests
      run: ./gradlew :tools:nav-preprocessor:test

    - name: Android Debug Build
      run: ./gradlew :apps:androidApp:assembleDebug

    - name: Verify Demo Package
      run: |
        chmod +x scripts/verify-demo-package.sh
        scripts/verify-demo-package.sh

    - name: Upload Test Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: tools/nav-preprocessor/build/reports/tests/
